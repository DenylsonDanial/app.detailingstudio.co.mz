<svg width="550" height="550" viewBox="0 0 550 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background decorativo -->
  <circle cx="450" cy="100" r="80" fill="#6366F1" opacity="0.05"/>
  <circle cx="100" cy="450" r="100" fill="#EC4899" opacity="0.05"/>
  <circle cx="500" cy="500" r="60" fill="#10B981" opacity="0.05"/>
  
  <!-- Laptop/Monitor principal -->
  <rect x="100" y="150" width="350" height="250" rx="12" fill="#1E293B" opacity="0.9"/>
  <rect x="110" y="160" width="330" height="200" rx="4" fill="#F8FAFC"/>
  
  <!-- Tela do laptop - Dashboard -->
  <!-- Header da tela -->
  <rect x="115" y="165" width="320" height="25" fill="url(#primaryGradient)" opacity="0.1"/>
  <circle cx="125" cy="177.5" r="5" fill="#6366F1" opacity="0.3"/>
  <rect x="135" y="172.5" width="60" height="10" rx="5" fill="#6366F1" opacity="0.3"/>
  
  <!-- Cards de métricas -->
  <g opacity="0.8">
    <!-- Card 1 - Receitas -->
    <rect x="125" y="200" width="90" height="60" rx="8" fill="url(#secondaryGradient)" opacity="0.15"/>
    <rect x="130" y="210" width="30" height="4" rx="2" fill="#10B981"/>
    <rect x="130" y="220" width="50" height="8" rx="4" fill="#10B981" opacity="0.5"/>
    <circle cx="145" cy="240" r="10" fill="#10B981" opacity="0.3"/>
    
    <!-- Card 2 - Despesas -->
    <rect x="230" y="200" width="90" height="60" rx="8" fill="url(#accentGradient)" opacity="0.15"/>
    <rect x="235" y="210" width="30" height="4" rx="2" fill="#EF4444"/>
    <rect x="235" y="220" width="50" height="8" rx="4" fill="#EF4444" opacity="0.5"/>
    <circle cx="250" cy="240" r="10" fill="#EF4444" opacity="0.3"/>
    
    <!-- Card 3 - Lucro -->
    <rect x="335" y="200" width="90" height="60" rx="8" fill="url(#primaryGradient)" opacity="0.15"/>
    <rect x="340" y="210" width="30" height="4" rx="2" fill="#6366F1"/>
    <rect x="340" y="220" width="50" height="8" rx="4" fill="#6366F1" opacity="0.5"/>
    <circle cx="355" cy="240" r="10" fill="#6366F1" opacity="0.3"/>
  </g>
  
  <!-- Gráfico de barras -->
  <g opacity="0.6">
    <rect x="130" y="290" width="15" height="50" rx="4" fill="#10B981"/>
    <rect x="155" y="270" width="15" height="70" rx="4" fill="#0EA5E9"/>
    <rect x="180" y="280" width="15" height="60" rx="4" fill="#6366F1"/>
    <rect x="205" y="260" width="15" height="80" rx="4" fill="#EC4899"/>
    <rect x="230" y="275" width="15" height="65" rx="4" fill="#F59E0B"/>
  </g>
  
  <!-- Linha de tendência -->
  <path d="M 260 320 Q 300 290, 340 300 T 420 285" stroke="#6366F1" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <circle cx="260" cy="320" r="4" fill="#6366F1"/>
  <circle cx="340" cy="300" r="4" fill="#6366F1"/>
  <circle cx="420" cy="285" r="4" fill="#6366F1"/>
  
  <!-- Base do laptop -->
  <rect x="80" y="400" width="390" height="8" rx="4" fill="#1E293B" opacity="0.8"/>
  <rect x="220" y="408" width="110" height="4" rx="2" fill="#475569" opacity="0.6"/>
  
  <!-- Documentos flutuantes -->
  <!-- Documento 1 - Esquerda -->
  <g transform="translate(20, 180)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="90" rx="6" fill="url(#primaryGradient)" opacity="0.1"/>
    <rect x="10" y="10" width="30" height="4" rx="2" fill="#6366F1" opacity="0.4"/>
    <rect x="10" y="20" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <rect x="10" y="27" width="45" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <rect x="10" y="34" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <circle cx="35" cy="55" r="15" fill="url(#secondaryGradient)" opacity="0.2"/>
    <rect x="10" y="75" width="50" height="6" rx="3" fill="#10B981" opacity="0.3"/>
  </g>
  
  <!-- Documento 2 - Direita -->
  <g transform="translate(460, 220)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="white" filter="url(#shadow)"/>
    <rect x="0" y="0" width="70" height="90" rx="6" fill="url(#accentGradient)" opacity="0.1"/>
    <rect x="10" y="10" width="35" height="4" rx="2" fill="#F59E0B" opacity="0.4"/>
    <rect x="10" y="20" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <rect x="10" y="27" width="40" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <rect x="10" y="34" width="50" height="3" rx="1.5" fill="#64748B" opacity="0.3"/>
    <!-- Mini gráfico de pizza -->
    <circle cx="35" cy="55" r="12" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="25 75" opacity="0.4"/>
    <circle cx="35" cy="55" r="12" fill="none" stroke="#EF4444" stroke-width="8" stroke-dasharray="25 75" stroke-dashoffset="-25" opacity="0.4"/>
    <rect x="10" y="75" width="50" height="6" rx="3" fill="#EF4444" opacity="0.3"/>
  </g>
  
  <!-- Ícones flutuantes -->
  <!-- Cifrão -->
  <g transform="translate(50, 350)">
    <circle cx="25" cy="25" r="25" fill="url(#secondaryGradient)" opacity="0.15"/>
    <text x="25" y="35" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#10B981" text-anchor="middle">$</text>
  </g>
  
  <!-- Gráfico de pizza -->
  <g transform="translate(470, 350)">
    <circle cx="25" cy="25" r="25" fill="url(#primaryGradient)" opacity="0.15"/>
    <circle cx="25" cy="25" r="12" fill="none" stroke="#6366F1" stroke-width="5" stroke-dasharray="20 80" opacity="0.6"/>
    <circle cx="25" cy="25" r="12" fill="none" stroke="#EC4899" stroke-width="5" stroke-dasharray="20 80" stroke-dashoffset="-20" opacity="0.6"/>
  </g>
  
  <!-- Calculadora -->
  <g transform="translate(20, 450)">
    <rect x="0" y="0" width="50" height="70" rx="6" fill="url(#primaryGradient)" opacity="0.15"/>
    <rect x="5" y="5" width="40" height="15" rx="3" fill="#6366F1" opacity="0.3"/>
    <circle cx="15" cy="30" r="4" fill="#6366F1" opacity="0.4"/>
    <circle cx="25" cy="30" r="4" fill="#6366F1" opacity="0.4"/>
    <circle cx="35" cy="30" r="4" fill="#6366F1" opacity="0.4"/>
    <circle cx="15" cy="42" r="4" fill="#6366F1" opacity="0.4"/>
    <circle cx="25" cy="42" r="4" fill="#6366F1" opacity="0.4"/>
    <circle cx="35" cy="42" r="4" fill="#6366F1" opacity="0.4"/>
    <rect x="10" y="52" width="30" height="10" rx="3" fill="#EC4899" opacity="0.4"/>
  </g>
  
  <!-- Moedas empilhadas -->
  <g transform="translate(480, 430)">
    <ellipse cx="25" cy="40" rx="20" ry="6" fill="#F59E0B" opacity="0.3"/>
    <ellipse cx="25" cy="35" rx="20" ry="6" fill="#F59E0B" opacity="0.4"/>
    <ellipse cx="25" cy="30" rx="20" ry="6" fill="#F59E0B" opacity="0.5"/>
    <ellipse cx="25" cy="25" rx="20" ry="6" fill="#F59E0B" opacity="0.6"/>
  </g>
  
  <!-- Sombra suave -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
